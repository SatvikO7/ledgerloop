[project]
name = "ledgerloop"
version = "0.1.0"
description = "Three-way, confidence-calibrated reconciliation agent with an honest exception list."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.9",
    "rapidfuzz>=3.9",
]

# Dependencies are added by the step that first needs them, so the
# money/contract layer stays installable and testable with no heavy transitive
# tree. Steps 0-5 needed pydantic alone; `rapidfuzz` arrives with T3, which is
# the first tier that has to score one string against another (PLAN.md 6.3).
#
# NetworkX is deliberately NOT here. PLAN.md 6.4 names it for T4, but the four
# constraint rules are adjacency lookups over a few hundred nodes, and
# `graph/memory_repo.py` implements them behind `graph/interface.py` in about
# as many lines as the import would cost. The Protocol is what keeps a
# NetworkX or Neo4j backend a drop-in rather than a rewrite.

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledgerloop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["ledgerloop"]
plugins = []

# `core` in PLAN.md §10/§17 was never a real directory. It is defined here as
# the money-critical surface: models + money + config. These are strict.
strict = true
warn_unreachable = true
disallow_any_explicit = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.coverage.run]
source = ["src/ledgerloop"]
branch = true
